services:
  - type: web
    name: terramind-ai-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: TERRAMIND_RAG_AUTO_INGEST
        value: "true"
      - key: TERRAMIND_MODEL_BUCKET
        value: model-artifacts
      - key: TERRAMIND_MODEL_OBJECT
        value: efficientnet-b0/best_model.pth
      - key: TERRAMIND_CORS_ORIGINS
        value: https://terramind-ai-72q1.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: TERRAMIND_LOW_CONFIDENCE_THRESHOLD
        value: "0.35"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TERRAMIND_MODEL_SHA256
        sync: false
